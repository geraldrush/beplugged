<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>COS1511 Practice — Beplugged Academy</title>
  <meta name="description" content="Write, run and check C++ for UNISA COS1511, in the browser.">
  <link rel="icon" href="/img/favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
  <style>
    :root {
      --ink-900:#0d1826; --ink-800:#14233a; --ink-700:#1f3049; --ink-500:#4a5568;
      --ink-400:#6b7688; --line:#e3e8ef; --surface:#fff; --surface-alt:#f7f9fc;
      --brand:#f05023; --brand-dark:#d23f14; --ok:#1e8750; --warn:#a16a1b; --err:#c0392b;
      --focus:#2f80ed; --radius:6px; --radius-lg:8px; --mono:'JetBrains Mono','SF Mono',Consolas,monospace;
    }
    *{box-sizing:border-box;}
    html,body{height:100%;}
    body{
      margin:0;display:flex;flex-direction:column;
      font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
      color:var(--ink-500);background:#eef2f7;-webkit-font-smoothing:antialiased;
    }

    /* Top bar */
    .bar{
      display:flex;align-items:center;gap:14px;flex-wrap:wrap;
      padding:10px 18px;background:var(--surface);color:var(--ink-900);flex:0 0 auto;
      border-bottom:1px solid var(--line);
    }
    .bar img{height:30px;width:auto;}
    .brand-lockup{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;}
    .bar .title{font-size:15px;font-weight:600;letter-spacing:-.01em;}
    .bar .title span{color:var(--ink-400);font-weight:400;}
    .bar .spacer{margin-left:auto;}
    .bar a{color:var(--ink-500);font-size:13.5px;text-decoration:none;}
    .bar a:hover{color:var(--brand);}
    .bar-actions{display:flex;align-items:center;gap:10px;margin-left:auto;}
    .bar .btn{background:var(--ink-900);border-color:var(--ink-900);color:#fff;}
    .bar .btn:hover{background:var(--ink-800);}

    .academy-progress{
      flex:0 0 auto;display:grid;grid-template-columns:minmax(220px,1fr) minmax(220px,2fr) auto;
      gap:16px;align-items:center;padding:12px 18px;background:#fbfcfe;border-bottom:1px solid var(--line);
    }
    .academy-progress-main{display:flex;align-items:center;gap:10px;min-width:0;flex-wrap:wrap;}
    .course-eyebrow{
      color:var(--brand);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
    }
    #current-chip{
      color:var(--ink-900);font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    }
    #progress-count{color:var(--ink-400);font-size:12.5px;}
    .academy-meter{
      height:8px;overflow:hidden;border-radius:999px;background:#dfe7f1;
    }
    .academy-meter span{
      display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brand),#1e8750);
      border-radius:inherit;transition:width .24s ease;
    }
    .academy-progress-actions{display:flex;gap:8px;justify-content:flex-end;}

    /* Layout
       Three columns, with the middle one split so program output sits under
       the editor at full editor width instead of squeezed into a side column.
       Every divider drags, and the sizes are remembered per browser. */
    .wrap{
      flex:1 1 auto;display:flex;min-height:0;margin:14px 16px 16px;
      overflow:hidden;background:var(--surface);border:1px solid var(--line);
      border-radius:var(--radius-lg);box-shadow:0 14px 38px rgba(13,24,38,.08);
      --w-list:292px; --w-side:390px; --h-output:240px;
    }
    .pane{min-width:0;min-height:0;display:flex;flex-direction:column;}
    .col-centre{flex:1 1 auto;display:flex;flex-direction:column;min-width:0;min-height:0;}
    .pane.list{flex:0 0 var(--w-list);}
    .pane.side{flex:0 0 var(--w-side);}
    .pane.output{flex:0 0 var(--h-output);min-height:74px;}

    /* Drag handles */
    .gutter{flex:0 0 6px;background:#edf1f6;position:relative;touch-action:none;}
    .gutter::after{
      content:"";position:absolute;inset:0;background:transparent;
    }
    .gutter:hover,.gutter.dragging{background:var(--brand);}
    .gutter.v{cursor:col-resize;}
    .gutter.h{cursor:row-resize;flex:0 0 6px;}
    .gutter.v::before{
      content:"";position:absolute;top:50%;left:1px;width:4px;height:26px;
      transform:translateY(-50%);border-radius:3px;background:rgba(0,0,0,.14);
    }
    .gutter.h::before{
      content:"";position:absolute;left:50%;top:1px;height:4px;width:26px;
      transform:translateX(-50%);border-radius:3px;background:rgba(0,0,0,.14);
    }
    .gutter:hover::before,.gutter.dragging::before{background:rgba(255,255,255,.85);}
    body.resizing{cursor:inherit;user-select:none;}
    body.resizing iframe,body.resizing .CodeMirror{pointer-events:none;}
    .pane-head{
      flex:0 0 auto;display:flex;align-items:center;gap:8px;
      padding:10px 14px;background:#fbfcfe;border-bottom:1px solid var(--line);
      font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-400);
    }
    .pane-body{flex:1 1 auto;overflow:auto;background:var(--surface);}

    /* Exercise list */
    .ex{
      display:block;width:100%;text-align:left;border:none;border-bottom:1px solid var(--line);
      background:none;padding:13px 14px;cursor:pointer;font-family:inherit;
    }
    .ex:hover{background:var(--surface-alt);}
    .ex.active{background:#fff6f3;box-shadow:inset 4px 0 0 var(--brand);}
    .ex b{display:block;font-size:13.5px;color:var(--ink-900);font-weight:600;line-height:1.35;}
    .ex small{display:block;margin-top:2px;font-size:11.5px;color:var(--ink-400);}

    /* Question text */
    .q{padding:18px 18px 20px;font-size:14.2px;line-height:1.68;}
    .q h3{margin:0 0 6px;font-size:19px;color:var(--ink-900);line-height:1.28;}
    .q .marks{display:inline-block;margin-bottom:10px;padding:1px 7px;border-radius:20px;
      background:#fff1eb;color:var(--brand);font-size:11px;font-weight:700;}
    .q p{margin:0 0 9px;}
    .q ul{margin:0 0 10px;padding-left:18px;}
    .q li{margin-bottom:4px;}
    .q pre{
      margin:0 0 10px;padding:9px 11px;background:var(--ink-900);color:#e8eef7;
      border-radius:var(--radius);font-family:var(--mono);font-size:12px;line-height:1.5;
      overflow-x:auto;white-space:pre;
    }
    .grp{
      padding:9px 13px 5px;font-size:10.5px;font-weight:700;letter-spacing:.07em;
      text-transform:uppercase;color:var(--ink-400);background:var(--surface-alt);
      border-bottom:1px solid var(--line);position:sticky;top:0;z-index:1;
    }
    .ex.pending{opacity:.45;cursor:default;}
    .ex.pending:hover{background:none;}
    .ex .tick{float:right;color:var(--ok);font-weight:700;margin-top:-16px;}
    .note-box{
      margin:0 0 10px;padding:8px 11px;background:#fff8ec;border-left:3px solid var(--warn);
      border-radius:0 5px 5px 0;font-size:13px;line-height:1.55;color:#6b4a12;
    }
    .task-box{
      margin:0 0 12px;padding:12px 14px;background:#fff6f3;border:1px solid #f7d4c5;
      border-radius:6px;font-size:13.4px;line-height:1.55;color:#5a3a30;
    }
    .done-btn{margin:4px 0 8px;}
    .theory{border-left:2px solid var(--brand);padding:2px 0 2px 13px;margin:13px 0;}
    .theory-num{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
      color:var(--brand);margin-bottom:5px;}
    .theory-btn{background:none;border:1px solid var(--ink-400);color:var(--ink-400);
      font:inherit;font-size:12px;padding:3px 11px;border-radius:5px;cursor:pointer;margin-top:7px;}
    .theory-btn:hover{border-color:var(--brand);color:var(--brand);}
    .theory-answer{margin-top:9px;}
    .q .label{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
      color:var(--ink-400);margin:12px 0 5px;}

    /* Editor */
    .CodeMirror{height:100%;font-family:var(--mono);font-size:13.5px;line-height:1.55;}
    #fallback{
      width:100%;height:100%;border:none;padding:12px;resize:none;
      font-family:var(--mono);font-size:13.5px;line-height:1.55;
      background:#212121;color:#eee;
    }
    .editor-body{flex:1 1 auto;min-height:0;background:#212121;}

    /* Buttons */
    .btn{
      display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 13px;
      border:1px solid var(--line);border-radius:var(--radius);background:#fff;
      font-family:inherit;font-size:13px;font-weight:600;color:var(--ink-700);cursor:pointer;
    }
    .btn:hover{background:var(--surface-alt);}
    .btn.run{background:var(--brand);border-color:var(--brand);color:#fff;}
    .btn.run:hover{background:var(--brand-dark);}
    .btn:focus-visible{outline:3px solid rgba(47,128,237,.28);outline-offset:2px;}
    .btn:disabled{opacity:.55;cursor:default;}

    /* Output */
    .io-label{
      padding:7px 13px;font-size:11px;font-weight:700;letter-spacing:.06em;
      text-transform:uppercase;color:var(--ink-400);background:var(--surface-alt);
      border-bottom:1px solid var(--line);border-top:1px solid var(--line);
    }
    #stdin{
      flex:0 0 auto;width:100%;height:76px;border:none;padding:9px 15px;resize:none;
      font-family:var(--mono);font-size:13px;line-height:1.55;
      background:#16233a;color:#cfe0f5;
    }
    #stdin::placeholder{color:#6d829e;}
    #stdin:focus{outline:none;background:#1a2942;}
    #stdin-label{
      background:#0b1524;color:#8fa3bd;border-top:1px solid rgba(255,255,255,.08);
      border-bottom:none;text-transform:none;letter-spacing:0;font-weight:500;
      font-size:11.5px;padding:6px 15px;
    }
    #stdout{
      flex:1 1 auto;margin:0;padding:13px 15px;overflow:auto;white-space:pre-wrap;
      word-break:break-word;font-family:var(--mono);font-size:13.5px;line-height:1.6;
      background:var(--ink-900);color:#e8eef7;
    }
    #stdout .err{color:#ff9c8a;}
    #stdout .note{color:#9fb0c6;}
    #stdout .ok{color:#7fd6a2;}
    /* What the student typed, shown the way a terminal would show it having
       been echoed back: present, but visibly not the program's own output. */
    #stdout .typed{color:#8fd0ff;}
    #stdout .rule{color:#4a5d75;}

    /* Walkthrough */
    .tourx-veil{position:fixed;background:rgba(13,24,38,.66);z-index:5000;}
    .tourx-ring{
      position:fixed;z-index:5001;border:2px solid var(--brand);border-radius:6px;
      box-shadow:0 0 0 4px rgba(240,80,35,.22);pointer-events:none;transition:all .2s ease;
    }
    .tourx-bubble{
      position:fixed;z-index:5002;width:min(350px,calc(100vw - 28px));
      background:#fff;border-radius:9px;box-shadow:0 20px 50px rgba(13,24,38,.4);
      padding:16px 17px 13px;
    }
    .tourx-bubble h4{margin:0 0 6px;font-size:15.5px;font-weight:700;color:var(--ink-900);}
    .tourx-bubble p{margin:0 0 9px;font-size:13.6px;line-height:1.58;color:var(--ink-500);}
    .tourx-use{
      margin:0 0 12px;padding:8px 10px;background:#fff6f3;border-left:3px solid var(--brand);
      border-radius:0 5px 5px 0;font-size:12.8px;line-height:1.5;color:#5a3a30;
    }
    .tourx-foot{
      display:flex;align-items:center;justify-content:space-between;gap:8px;
      border-top:1px solid var(--line);padding-top:10px;
    }
    .tourx-step{font-size:11.5px;color:var(--ink-400);white-space:nowrap;}
    .tourx-btns{display:flex;gap:6px;}
    .tourx-btns button{
      border:1px solid var(--line);background:#fff;color:var(--ink-700);border-radius:5px;
      padding:5px 11px;font-family:inherit;font-size:12.6px;font-weight:600;cursor:pointer;
    }
    .tourx-btns .tourx-next{background:var(--brand);border-color:var(--brand);color:#fff;}
    .tourx-skip{
      border:none;background:none;padding:0;color:var(--ink-400);
      font-family:inherit;font-size:12.4px;text-decoration:underline;cursor:pointer;
    }

    .status{font-size:12px;color:var(--ink-400);margin-left:auto;}
    .lesson-position{margin-left:auto;color:var(--ink-500);font-size:12px;font-weight:600;text-transform:none;letter-spacing:0;}
    .spacer-sm{margin-left:auto;}
    .btn.small{height:24px;padding:0 9px;font-size:11.5px;font-weight:600;}
    .pane.editor{flex:1 1 auto;min-height:90px;}

    /* Tab bar, phone only. */
    .tabs{display:none;flex:0 0 auto;background:var(--surface);border-bottom:1px solid var(--line);}
    .tabs button{
      flex:1 1 0;min-width:0;height:46px;border:none;background:none;
      font-family:inherit;font-size:13.5px;font-weight:700;color:var(--ink-400);
      border-bottom:3px solid transparent;cursor:pointer;
    }
    .tabs button.on{color:var(--ink-900);border-bottom-color:var(--brand);}

    /* Below this the three columns stop making sense. Rather than stack them
       and leave four unusable slivers, one panel is shown at a time and the
       tab bar switches between them. The dividers go: there is nothing left
       to drag against. */
    @media (max-width:900px){
      .bar{padding:9px 12px;}
      .academy-progress{grid-template-columns:1fr;gap:9px;padding:10px 12px;}
      .academy-progress-actions{justify-content:flex-start;}
      .tabs{display:flex;}
      .wrap{flex-direction:column;margin:0;border-left:none;border-right:none;border-bottom:none;border-radius:0;box-shadow:none;}
      .gutter.v{display:none;}
      .wrap > .pane,.wrap > .col-centre{display:none;}
      .wrap[data-view="list"] > .pane.list{display:flex;flex:1 1 auto;}
      .wrap[data-view="notes"] > .pane.side{display:flex;flex:1 1 auto;}
      .wrap[data-view="code"] > .col-centre{display:flex;flex:1 1 auto;}
      /* Editor and output share the screen, output a little under half so the
         keyboard input line stays reachable without scrolling. */
      .pane.editor{flex:1 1 auto;min-height:0;}
      .pane.output{flex:0 0 47%;}
      .gutter.h{flex:0 0 6px;}

      /* Touch targets. 32px is comfortable with a mouse and fiddly with a
         thumb. */
      .btn{height:42px;font-size:14px;padding:0 15px;}
      .btn.small{height:34px;font-size:12.5px;}
      .pane-head{flex-wrap:wrap;gap:7px;padding-top:7px;padding-bottom:7px;}
      .ex{padding-top:12px;padding-bottom:12px;}
      .theory-btn{height:38px;padding:0 15px;}

      /* Long words and wide code must not push the page sideways. */
      .q{overflow-wrap:break-word;}
      #stdout{font-size:12.5px;}
      .CodeMirror{font-size:12.5px;}
    }

    /* Phones held upright, where the header eats a real share of the screen. */
    @media (max-width:560px){
      .bar{padding-left:12px;padding-right:12px;gap:10px;}
      .bar img{height:24px;}
      .bar .title span{display:none;}
      .bar-actions{width:100%;margin-left:0;justify-content:space-between;}
      .bar .bar-link{display:none;}
      #current-chip{white-space:normal;}
      .academy-progress-actions .btn{flex:1 1 0;}
    }
  
    /* Off-screen page heading: these pages build their content in JS, so the
       document still needs one h1 for assistive tech and crawlers. */
    .sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0;}
</style>
</head>
<body>
  <h1 class="sr-only">COS1511 Practice &mdash; Beplugged Academy</h1>
  <div class="bar">
    <a class="brand-lockup" href="/training/courses/unisa-cos1511-tutorial-class">
      <img src="/img/logo.png" alt="Beplugged Academy">
      <div class="title">COS1511 Practice <span>&middot; Introduction to Programming</span></div>
    </a>
    <div class="bar-actions">
      <button type="button" class="btn small" id="guide-btn">Guide</button>
      <a class="bar-link" href="/training/courses/unisa-cos1511-tutorial-class">About this course</a>
    </div>
  </div>

  <div class="academy-progress" aria-label="Course progress">
    <div class="academy-progress-main">
      <span class="course-eyebrow">Course path</span>
      <strong id="current-chip">Loading lesson</strong>
      <span id="progress-count">0 completed</span>
    </div>
    <div class="academy-meter" aria-hidden="true"><span id="progress-fill"></span></div>
    <div class="academy-progress-actions">
      <button type="button" class="btn small" id="prev-lesson-btn">Previous</button>
      <button type="button" class="btn small" id="next-lesson-btn">Next lesson</button>
    </div>
  </div>

  <!-- Phone only. Four panes stacked in a phone viewport gives four boxes too
       short to use any of them, so on a narrow screen one panel gets the whole
       screen and these switch between them. Hidden entirely on desktop, where
       the three columns are visible at once. -->
  <nav class="tabs" id="tabs">
    <button type="button" data-view="list">Lessons</button>
    <button type="button" data-view="notes">Notes</button>
    <button type="button" data-view="code">Code</button>
  </nav>

  <div class="wrap" id="wrap" data-view="notes">
    <!-- Exercises -->
    <section class="pane list">
      <div class="pane-head">Course path</div>
      <div class="pane-body" id="exercise-list"></div>
    </section>

    <div class="gutter v" data-resize="list" title="Drag to resize"></div>

    <!-- Editor above, output below -->
    <div class="col-centre">
      <section class="pane editor">
        <div class="pane-head">
          <button class="btn run" id="run-btn">&#9654; Run</button>
          <button class="btn" id="reset-btn">Reset</button>
          <span class="status" id="status">Ready</span>
        </div>
        <div class="editor-body"><textarea id="fallback" spellcheck="false"></textarea></div>
      </section>

      <div class="gutter h" data-resize="output" title="Drag to resize"></div>

      <section class="pane output">
        <div class="pane-head">
          Program output
          <span class="spacer-sm"></span>
          <button class="btn small" id="clear-btn">Clear</button>
          <button class="btn small" id="expand-btn" title="Make the output taller">Expand</button>
        </div>
        <pre id="stdout"><span class="note">Press Run to compile and execute.</span></pre>
        <div class="io-label" id="stdin-label">Keyboard input &mdash; type the lines your program will read, then Run</div>
        <textarea id="stdin" spellcheck="false" placeholder="One value per line, in the order cin asks for them."></textarea>
      </section>
    </div>

    <div class="gutter v" data-resize="side" title="Drag to resize"></div>

    <!-- Question and keyboard input -->
    <section class="pane side">
      <div class="pane-head">Lesson brief <span class="lesson-position" id="lesson-position">Lesson</span></div>
      <div class="pane-body" id="question"></div>
    </section>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>
  <script src="/academy/curriculum.js?v=14"></script>
  <script src="/academy/exercises.js?v=14"></script>
  <!-- Compiling happens on the server so a student can practise on any device
       with no download. engine.js is the browser-hosted toolchain: it still
       works, but it costs a ~39MB first visit and needs a desktop, so it is
       not what a student lands on. -->
  <script src="/academy/runner-server.js?v=1"></script>
  <script src="/academy/tour.js?v=14"></script>
  <script>
    (function () {
      var editor = null;
      var fallback = document.getElementById("fallback");
	      var statusEl = document.getElementById("status");
	      var outEl = document.getElementById("stdout");
	      var current = null;
	      var activeIndex = -1;
	      var currentChipEl = document.getElementById("current-chip");
	      var progressCountEl = document.getElementById("progress-count");
	      var progressFillEl = document.getElementById("progress-fill");
	      var lessonPositionEl = document.getElementById("lesson-position");
	      var prevLessonBtn = document.getElementById("prev-lesson-btn");
	      var nextLessonBtn = document.getElementById("next-lesson-btn");

      // CodeMirror gives syntax highlighting and line numbers, which matter
      // when a student is hunting a missing semicolon. If the CDN is blocked
      // the plain textarea underneath still works.
      if (window.CodeMirror) {
        editor = CodeMirror.fromTextArea(fallback, {
          mode: "text/x-c++src",
          theme: "material-darker",
          lineNumbers: true,
          indentUnit: 4,
          matchBrackets: true,
          lineWrapping: false,
        });
      }

      function getCode() { return editor ? editor.getValue() : fallback.value; }
      function setCode(v) { editor ? editor.setValue(v) : (fallback.value = v); }

      function storeKey(id) { return "cos1511:" + id; }

      function say(html, cls) {
        outEl.innerHTML = '<span class="' + (cls || "note") + '"></span>';
        outEl.firstChild.textContent = html;
      }

      /* Lesson notes, past-paper briefs and the answers to theory questions
         are all the same handful of shapes, so they share one renderer. */
      function renderBlocks(target, blocks) {
        (blocks || []).forEach(function (block) {
          if (block.type === "p") {
            var el = document.createElement("p");
            el.textContent = block.text;
            target.appendChild(el);
          } else if (block.type === "note") {
            var n = document.createElement("div");
            n.className = "note-box";
            n.textContent = block.text;
            target.appendChild(n);
          } else if (block.type === "list") {
            var ul = document.createElement("ul");
            block.items.forEach(function (i) {
              var li = document.createElement("li");
              li.textContent = i;
              ul.appendChild(li);
            });
            target.appendChild(ul);
          } else if (block.type === "code") {
            if (block.label) {
              var lbl = document.createElement("div");
              lbl.className = "label";
              lbl.textContent = block.label;
              target.appendChild(lbl);
            }
            var pre = document.createElement("pre");
            pre.textContent = block.text;
            target.appendChild(pre);
          }
        });
      }

      function renderQuestion(ex) {
        var q = document.getElementById("question");
        q.innerHTML = "";
        var wrap = document.createElement("div");
        wrap.className = "q";

        var h = document.createElement("h3");
        h.textContent = (ex.lesson ? "Lesson " + ex.lesson + ": " : "") + ex.title;
        wrap.appendChild(h);

        if (ex.meta) {
          var m = document.createElement("span");
          m.className = "marks";
          m.textContent = ex.meta;
          wrap.appendChild(m);
        }

        // Lessons teach first; past papers only have the question.
        renderBlocks(wrap, ex.teach || ex.brief || []);

        if (ex.task) {
          var tl = document.createElement("div");
          tl.className = "label";
          tl.textContent = "Now you try";
          wrap.appendChild(tl);
          var tb = document.createElement("div");
          tb.className = "task-box";
          tb.textContent = ex.task;
          wrap.appendChild(tb);
        }

        /* The guide's own exercises. These are written out rather than typed
           into the editor — several ask for a rewrite, or for which of four
           fragments runs — so there is nothing to compile and nothing to mark
           automatically. The answer is hidden behind a click so a student
           commits to one before seeing it, which is the only part of this
           that does any teaching. */
        if (ex.theory && ex.theory.length) {
          var tHead = document.createElement("div");
          tHead.className = "label";
          tHead.textContent = "Exercises from the study guide";
          wrap.appendChild(tHead);

          ex.theory.forEach(function (item) {
            var box = document.createElement("div");
            box.className = "theory";

            var num = document.createElement("div");
            num.className = "theory-num";
            num.textContent = item.id ? "Exercise " + item.id : "Exercise";
            box.appendChild(num);

            renderBlocks(box, item.ask);

            if (item.answer && item.answer.length) {
              var reveal = document.createElement("button");
              reveal.className = "theory-btn";
              reveal.textContent = "Show answer";

              var ans = document.createElement("div");
              ans.className = "theory-answer";
              ans.hidden = true;
              renderBlocks(ans, item.answer);

              reveal.addEventListener("click", function () {
                ans.hidden = !ans.hidden;
                reveal.textContent = ans.hidden ? "Show answer" : "Hide answer";
              });

              box.appendChild(reveal);
              box.appendChild(ans);
            }

            wrap.appendChild(box);
          });
        }


        // Progress is the student's own claim, not a mark. It only tracks
        // where they got to.
        var done = document.createElement("button");
        done.className = "btn done-btn";
        done.textContent = isDone(ex.id) ? "✓ Marked as done" : "Mark as done";
        done.addEventListener("click", function () {
          var now = !isDone(ex.id);
          try { localStorage.setItem(doneKey(ex.id), now ? "1" : "0"); } catch (e) {}
          done.textContent = now ? "✓ Marked as done" : "Mark as done";
          buildList();
	          [].forEach.call(document.querySelectorAll(".ex"), function (b) {
	            b.classList.toggle("active", b.dataset.id === ex.id);
	          });
	          updateProgress();
	        });
        wrap.appendChild(done);

        q.appendChild(wrap);
      }

      /* On a phone only one panel is on screen, so choosing something has to
         take you to it. On desktop these are no-ops: everything is already
         visible and moving the view would be meaningless. */
      var wrapEl = document.getElementById("wrap");

      function isNarrow() {
        return window.matchMedia("(max-width:900px)").matches;
      }

      function showView(view) {
        wrapEl.dataset.view = view;
        [].forEach.call(document.querySelectorAll(".tabs button"), function (b) {
          b.classList.toggle("on", b.dataset.view === view);
        });
        // CodeMirror measures itself when it is laid out. Revealing the editor
        // after it was display:none leaves it sized for nothing until told.
        if (view === "code" && editor) setTimeout(function () { editor.refresh(); }, 0);
      }

      [].forEach.call(document.querySelectorAll(".tabs button"), function (b) {
        b.addEventListener("click", function () { showView(b.dataset.view); });
      });

	      function select(id) {
	        activeIndex = ITEMS.findIndex(function (e) { return e.id === id; });
	        if (activeIndex < 0) return;
	        var ex = ITEMS[activeIndex];
	        current = ex;

	        [].forEach.call(document.querySelectorAll(".ex"), function (b) {
	          b.classList.toggle("active", b.dataset.id === id);
	        });
	        var activeButton = document.querySelector('.ex.active');
	        if (activeButton && activeButton.scrollIntoView) {
	          activeButton.scrollIntoView({ block: "nearest" });
	        }

	        var saved = null;
        try { saved = localStorage.getItem(storeKey(id)); } catch (e) {}
        setCode(saved !== null ? saved : ex.starter);
        document.getElementById("stdin").value = ex.sampleInput || "";
	        renderQuestion(ex);
	        say("Press Run to compile and execute.");
	        updateProgress();
	        if (editor) setTimeout(function () { editor.refresh(); }, 0);
	      }

      // One ordered path: the lessons in study-guide order, then the past
      // paper questions. Past papers keep their own shape, so they are
      // normalised into the same fields the renderer uses.
      var ITEMS = CURRICULUM.map(function (l) {
        return {
          id: l.id || ("pending-" + l.lesson),
          group: l.part,
          lesson: l.lesson,
          title: l.title,
          pending: !!l.pending,
          teach: l.teach,
          task: l.task,
          starter: l.starter || "",
          sampleInput: l.sampleInput,
          expectedOutput: l.expectedOutput,
          theory: l.theory,
        };
      }).concat(EXERCISES.map(function (e) {
        return {
          id: e.id,
          group: EXAM_PART,
          title: e.title,
          meta: e.source + (e.marks ? " · " + e.marks + " marks" : ""),
          brief: e.brief,
          starter: e.starter,
          sampleInput: e.sampleInput,
          expectedOutput: e.expectedOutput,
        };
      }));

	      function doneKey(id) { return "cos1511:done:" + id; }
	      function isDone(id) {
	        try { return localStorage.getItem(doneKey(id)) === "1"; } catch (e) { return false; }
	      }

	      function availableItems() {
	        return ITEMS.filter(function (item) { return !item.pending; });
	      }

	      function nextAvailableIndex(from, dir) {
	        for (var i = from + dir; i >= 0 && i < ITEMS.length; i += dir) {
	          if (!ITEMS[i].pending) return i;
	        }
	        return -1;
	      }

	      function currentPosition() {
	        if (!current) return 0;
	        return availableItems().findIndex(function (item) { return item.id === current.id; }) + 1;
	      }

	      function updateProgress() {
	        var available = availableItems();
	        var total = available.length;
	        var complete = available.filter(function (item) { return isDone(item.id); }).length;
	        var pos = currentPosition();
	        var percent = total ? Math.round((complete / total) * 100) : 0;
	        var title = current
	          ? ((current.lesson ? "Lesson " + current.lesson + ": " : "") + current.title)
	          : "Choose a lesson";

	        currentChipEl.textContent = title;
	        progressCountEl.textContent = complete + " of " + total + " complete";
	        progressFillEl.style.width = percent + "%";
	        lessonPositionEl.textContent = pos ? pos + " of " + total : "Lesson";

	        prevLessonBtn.disabled = activeIndex < 0 || nextAvailableIndex(activeIndex, -1) < 0;
	        nextLessonBtn.disabled = activeIndex < 0 || nextAvailableIndex(activeIndex, 1) < 0;
	      }

	      function goLesson(dir) {
	        var target = nextAvailableIndex(activeIndex, dir);
	        if (target < 0) return;
	        select(ITEMS[target].id);
	        if (isNarrow()) showView("notes");
	      }

	      function buildList() {
        var list = document.getElementById("exercise-list");
        list.innerHTML = "";
        var lastGroup = null;

        ITEMS.forEach(function (item) {
          if (item.group !== lastGroup) {
            lastGroup = item.group;
            var h = document.createElement("div");
            h.className = "grp";
            h.textContent = item.group;
            list.appendChild(h);
          }

          var b = document.createElement("button");
          b.className = "ex" + (item.pending ? " pending" : "");
          b.dataset.id = item.id;
          if (item.pending) b.disabled = true;

          var t = document.createElement("b");
          t.textContent = (item.lesson ? item.lesson + ". " : "") + item.title;
          b.appendChild(t);

          var sm = document.createElement("small");
          sm.textContent = item.pending
            ? "Not written yet"
            : (item.meta || "Lesson");
          b.appendChild(sm);

          if (!item.pending && isDone(item.id)) {
            var tick = document.createElement("span");
            tick.className = "tick";
            tick.textContent = "✓";
            b.appendChild(tick);
          }

          if (!item.pending) {
            b.addEventListener("click", function () {
              select(item.id);
              // Picking a lesson means you want to read it.
              if (isNarrow()) showView("notes");
            });
          }
          list.appendChild(b);
        });
      }

      // Work is kept per exercise so switching between them never loses code.
      function save() {
        if (!current) return;
        try { localStorage.setItem(storeKey(current.id), getCode()); } catch (e) {}
      }
	      setInterval(save, 4000);
	      window.addEventListener("beforeunload", save);

	      prevLessonBtn.addEventListener("click", function () { goLesson(-1); });
	      nextLessonBtn.addEventListener("click", function () { goLesson(1); });

	      document.getElementById("reset-btn").addEventListener("click", function () {
        if (!current) return;
        if (!confirm("Replace your code with the starter for this exercise?")) return;
        setCode(current.starter);
        save();
      });

      document.getElementById("run-btn").addEventListener("click", async function () {
        var btn = this;
        save();
        // The output appears in the code panel, so make sure that is the one
        // being looked at before anything is written to it.
        if (isNarrow()) showView("code");
        btn.disabled = true;
        statusEl.textContent = "Running...";
        say("Compiling...");

        try {
          if (CodeRunner.setProgressHandler) {
            CodeRunner.setProgressHandler(function (msg) {
              var text = typeof msg === "string" ? msg : ((msg && msg.phase) || "");
              var firstLine = text.split("\n")[0];
              // Kept generic so the same page works against either runner:
              // the server one only ever reports compiling and running, the
              // browser-hosted one also reports downloading and unpacking.
              var help = /Downloading/.test(text)
                ? "The compiler is downloading to this device. This only happens once."
                : /Starting|Building|Checking/.test(text)
                  ? "The compiler may still be unpacking or reading files from browser storage. Leave this tab open."
                  : "";
              statusEl.textContent = firstLine || "Running...";
              say(help ? text + "\n\n" + help : text);
            });
          }
          var typed = document.getElementById("stdin").value;
          var result = await CodeRunner.run(getCode(), typed);
          outEl.innerHTML = "";

          /* In Code::Blocks the values a student types appear after each
             prompt, because the terminal echoes them. Nothing echoes here:
             the program has already run to completion before any of this
             reaches the screen.

             They cannot be put back where they belong either. stdout records
             what was printed, not where each read happened, and the two run
             together — "Enter two numbers: " and "Sum: 22" arrive as a single
             line with no marker between them. Guessing at the boundary would
             put values on the wrong lines often enough to teach the wrong
             thing about where input goes.

             So the input is shown up front instead, marked as typed rather
             than printed. It answers what a student is actually asking when
             they look for it — what did the program read? — without
             inventing a transcript. */
          if (typed.trim() && result.stdout) {
            var head = document.createElement("span");
            head.className = "rule";
            head.textContent = "─── what you typed ───\n";
            outEl.appendChild(head);

            var t = document.createElement("span");
            t.className = "typed";
            t.textContent = typed.replace(/\n+$/, "") + "\n";
            outEl.appendChild(t);

            var rule = document.createElement("span");
            rule.className = "rule";
            rule.textContent = "─── what your program printed ───\n";
            outEl.appendChild(rule);
          }

          if (result.stdout) {
            var o = document.createElement("span");
            o.textContent = result.stdout;
            outEl.appendChild(o);
          }
          if (result.stderr) {
            var e = document.createElement("span");
            e.className = "err";
            e.textContent = (result.stdout ? "\n" : "") + result.stderr;
            outEl.appendChild(e);
          }
          if (!result.stdout && !result.stderr) {
            var n = document.createElement("span");
            n.className = "note";
            n.textContent = "(the program produced no output)";
            outEl.appendChild(n);
          }

          // Compare against the paper's expected output where we have it.
          if (current && current.expectedOutput && result.stdout) {
            var norm = function (s) { return s.replace(/\r/g, "").replace(/[ \t]+$/gm, "").trim(); };
            var pass = norm(result.stdout) === norm(current.expectedOutput);
            var v = document.createElement("span");
            v.className = pass ? "ok" : "err";
            v.textContent = pass
              ? "\n\n✓ Matches the expected output."
              : "\n\n✗ Does not match the expected output yet.";
            outEl.appendChild(v);
          }

          statusEl.textContent = result.stderr ? "Finished with errors" : "Done";
        } catch (err) {
          say(String(err && err.message ? err.message : err), "err");
          statusEl.textContent = "Failed";
        }

        btn.disabled = false;
      });

      document.getElementById("clear-btn").addEventListener("click", function () {
        say("Cleared. Press Run to compile and execute.");
      });

      // Quick way to give output the whole middle column without dragging.
      var expanded = false;
      document.getElementById("expand-btn").addEventListener("click", function () {
        var wrap = document.getElementById("wrap");
        expanded = !expanded;
        setSize("output", expanded ? Math.round(wrap.clientHeight * 0.62) : 260);
        this.textContent = expanded ? "Shrink" : "Expand";
      });

      /* ---- Resizable panes -------------------------------------------------
         Each divider writes a CSS variable on the wrapper. Sizes are clamped so
         a pane can never be dragged away entirely, and remembered per browser
         so the layout a student sets up is still there next time.
         -------------------------------------------------------------------- */
      var LIMITS = {
        list: { varName: "--w-list", min: 150, max: 460, axis: "x" },
        side: { varName: "--w-side", min: 220, max: 620, axis: "x" },
        output: { varName: "--h-output", min: 74, max: null, axis: "y" },
      };

      function setSize(which, px) {
        var cfg = LIMITS[which];
        var wrap = document.getElementById("wrap");
        var max = cfg.max || Math.max(120, wrap.clientHeight - 150);
        var v = Math.round(Math.min(Math.max(px, cfg.min), max));
        wrap.style.setProperty(cfg.varName, v + "px");
        try { localStorage.setItem("cos1511:pane:" + which, String(v)); } catch (e) {}
        if (editor) editor.refresh();
      }

      Object.keys(LIMITS).forEach(function (which) {
        var saved = null;
        try { saved = localStorage.getItem("cos1511:pane:" + which); } catch (e) {}
        if (saved) setSize(which, parseInt(saved, 10));
      });

      [].forEach.call(document.querySelectorAll(".gutter"), function (g) {
        g.addEventListener("pointerdown", function (e) {
          // Stacked layout: the dividers are decoration, not controls.
          if (window.matchMedia("(max-width:900px)").matches) return;

          var which = g.dataset.resize;
          var cfg = LIMITS[which];
          var wrap = document.getElementById("wrap");
          var startPos = cfg.axis === "x" ? e.clientX : e.clientY;
          var startSize = parseInt(getComputedStyle(wrap).getPropertyValue(cfg.varName), 10);

          g.setPointerCapture(e.pointerId);
          g.classList.add("dragging");
          document.body.classList.add("resizing");

          function move(ev) {
            var delta = (cfg.axis === "x" ? ev.clientX : ev.clientY) - startPos;
            // The exercise list grows rightwards; the other two grow the other
            // way, so their delta is inverted.
            setSize(which, which === "list" ? startSize + delta : startSize - delta);
          }

          function up(ev) {
            g.releasePointerCapture(ev.pointerId);
            g.classList.remove("dragging");
            document.body.classList.remove("resizing");
            g.removeEventListener("pointermove", move);
            g.removeEventListener("pointerup", up);
          }

          g.addEventListener("pointermove", move);
          g.addEventListener("pointerup", up);
          e.preventDefault();
        });

	        // Double click restores the default for that divider.
	        g.addEventListener("dblclick", function () {
	          var d = { list: 292, side: 390, output: 240 };
	          setSize(g.dataset.resize, d[g.dataset.resize]);
	        });
      });

      window.addEventListener("resize", function () { if (editor) editor.refresh(); });

      document.getElementById("guide-btn").addEventListener("click", function () {
        if (window.startAcademyTour) window.startAcademyTour();
      });

	      buildList();
	      var firstAvailable = availableItems()[0];
	      if (firstAvailable) select(firstAvailable.id);
	      else updateProgress();
	      showView("notes");

      CodeRunner.ready().then(function (info) {
        statusEl.textContent = info.label;
      });
    })();
  </script>
</body>
</html>
