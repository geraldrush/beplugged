<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Project Progress — Beplugged Tech</title>
    <link rel="icon" href="/img/favicon.ico" />
    <style>
      :root {
        --primary: #f05023;
        --dark: #2c2d3f;
        --page: #f6f7f9;
        --surface: #fafafb;
        --border: #e5e6ea;
        --muted: rgba(44, 45, 63, 0.66);
        --success: #1e8750;
        --amber: #a16a1b;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        background: var(--page); color: var(--dark);
        font-size: 0.9rem; line-height: 1.65; -webkit-font-smoothing: antialiased;
      }
      .wrap { max-width: 720px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
      header {
        background: #fff; border-bottom: 3px solid var(--primary);
        box-shadow: 0 1px 2px rgba(16, 18, 40, 0.05);
        padding: 0.85rem 0; margin-bottom: 1.5rem;
      }
      header .wrap { padding-top: 0; padding-bottom: 0; }
      header img { height: 34px; display: block; }
      h1 { font-size: 1.3rem; margin-bottom: 0.25rem; letter-spacing: -0.01em; }
      .meta { display: flex; flex-wrap: wrap; gap: 0.75rem; color: var(--muted); font-size: 0.8rem; margin-bottom: 1.25rem; }
      .card {
        background: #fff; border: 1px solid var(--border); border-radius: 0.375rem;
        box-shadow: 0 1px 2px rgba(16, 18, 40, 0.04); padding: 1.25rem; margin-bottom: 1rem;
      }
      .overall { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 0.7rem; }
      .overall .pct { font-size: 2rem; font-weight: 600; letter-spacing: -0.02em; }
      .overall .lbl { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); font-weight: 600; }
      .bar { height: 8px; border-radius: 4px; background: rgba(44,45,63,.09); overflow: hidden; }
      .bar span { display: block; height: 100%; background: var(--primary); border-radius: 4px; transition: width .3s; }
      .summary { margin-top: 0.7rem; font-size: 0.82rem; color: var(--muted); }
      .section-title { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); font-weight: 600; margin: 0 0 0.9rem; }
      .ms { display: flex; gap: 0.85rem; padding: 0.85rem 0; border-top: 1px solid var(--border); }
      .ms:first-of-type { border-top: 0; padding-top: 0; }
      .dot {
        flex: none; width: 22px; height: 22px; border-radius: 50%; margin-top: 0.15rem;
        display: flex; align-items: center; justify-content: center;
        font-size: 0.72rem; font-weight: 700;
        background: rgba(44,45,63,.08); color: var(--muted);
      }
      .ms.done .dot { background: rgba(30,135,80,.14); color: var(--success); }
      .ms.active .dot { background: rgba(240,80,35,.14); color: var(--primary); }
      .ms.blocked .dot { background: rgba(161,106,27,.16); color: var(--amber); }
      .ms .body { flex: 1; min-width: 0; }
      .ms .title { font-weight: 600; }
      .ms.done .title { color: var(--muted); }
      .ms .sub { font-size: 0.8rem; color: var(--muted); margin-top: 0.1rem; }
      .ms .minibar { height: 5px; border-radius: 3px; background: rgba(44,45,63,.08); margin-top: 0.45rem; overflow: hidden; max-width: 220px; }
      .ms .minibar span { display: block; height: 100%; background: var(--primary); border-radius: 3px; }
      .state { font-size: 0.72rem; font-weight: 600; padding: 0.12rem 0.45rem; border-radius: 0.25rem; white-space: nowrap; align-self: flex-start; }
      .state.done { background: rgba(30,135,80,.12); color: var(--success); }
      .state.active { background: rgba(240,80,35,.12); color: var(--primary); }
      .state.pending { background: rgba(44,45,63,.08); color: var(--muted); }
      .state.blocked { background: rgba(161,106,27,.14); color: var(--amber); }
      .msg { text-align: center; padding: 2.5rem 1.25rem; }
      .msg h2 { font-size: 1.15rem; margin-bottom: 0.5rem; }
      .msg p { color: var(--muted); }
      footer { text-align: center; color: var(--muted); font-size: 0.8rem; margin-top: 1.5rem; }
      .hidden { display: none !important; }
    </style>
  </head>
  <body>
    <header><div class="wrap"><img src="/img/logo.png" alt="Beplugged Tech" /></div></header>

    <div class="wrap">
      <div id="loading" class="card msg"><p>Loading…</p></div>

      <div id="invalid" class="card msg hidden">
        <h2>This link is no longer valid</h2>
        <p>Please contact <a href="mailto:info@beplugged.co.za">info@beplugged.co.za</a>.</p>
      </div>

      <div id="main" class="hidden">
        <h1 id="title">Project</h1>
        <div class="meta" id="meta"></div>

        <div class="card">
          <div class="overall">
            <div class="lbl">Overall progress</div>
            <div class="pct" id="pct">0%</div>
          </div>
          <div class="bar"><span id="bar" style="width:0%"></span></div>
          <div class="summary" id="summary"></div>
        </div>

        <div class="card">
          <div class="section-title">Milestones</div>
          <div id="milestones"></div>
        </div>
      </div>

      <footer>Beplugged Tech · info@beplugged.co.za</footer>
    </div>

    <script>
      (function () {
        var token = new URLSearchParams(location.search).get("t") || "";
        var $ = function (id) { return document.getElementById(id); };
        var show = function (id) {
          ["loading", "invalid", "main"].forEach(function (k) {
            $(k).classList.toggle("hidden", k !== id);
          });
        };
        function esc(v) {
          return String(v == null ? "" : v).replace(/&/g, "&amp;").replace(/</g, "&lt;")
            .replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
        }
        function when(d) {
          if (!d) return "";
          var t = new Date(d);
          return isNaN(t) ? "" : t.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
        }

        if (!token) { show("invalid"); return; }

        fetch("/api/progress/" + encodeURIComponent(token))
          .then(function (r) { return r.json().then(function (b) { return { ok: r.ok, b: b }; }); })
          .then(function (res) {
            if (!res.ok) { show("invalid"); return; }
            var p = res.b;
            $("title").textContent = p.name || "Project";
            $("meta").innerHTML = [
              p.project_code ? "<span>" + esc(p.project_code) + "</span>" : "",
              p.client_name ? "<span>" + esc(p.client_name) + "</span>" : "",
              p.due_date ? "<span>Due " + esc(when(p.due_date)) + "</span>" : "",
            ].filter(Boolean).join("");

            var pct = Number(p.percent || 0);
            $("pct").textContent = pct + "%";
            $("bar").style.width = pct + "%";

            var ms = p.milestones || [];
            var done = ms.filter(function (m) { return m.status === "done"; }).length;
            var remaining = ms.length - done;
            $("summary").textContent = ms.length
              ? done + " of " + ms.length + " milestones complete · " +
                (remaining ? remaining + " still to go" : "everything delivered")
              : "No milestones set yet.";

            $("milestones").innerHTML = ms.length
              ? ms.map(function (m) {
                  var st = m.status || "pending";
                  var mark = st === "done" ? "✓" : st === "blocked" ? "!" : "";
                  var sub = [];
                  if (m.total) sub.push(m.done + " of " + m.total + " items done");
                  if (m.due_date) sub.push("due " + when(m.due_date));
                  return (
                    '<div class="ms ' + esc(st) + '">' +
                      '<div class="dot">' + mark + "</div>" +
                      '<div class="body">' +
                        '<div class="title">' + esc(m.title) + "</div>" +
                        (m.description ? '<div class="sub">' + esc(m.description) + "</div>" : "") +
                        (sub.length ? '<div class="sub">' + esc(sub.join(" · ")) + "</div>" : "") +
                        (m.total ? '<div class="minibar"><span style="width:' + Number(m.percent || 0) + '%"></span></div>' : "") +
                      "</div>" +
                      '<div class="state ' + esc(st) + '">' + esc(st === "done" ? "Complete" : st === "active" ? "In progress" : st === "blocked" ? "Blocked" : "To do") + "</div>" +
                    "</div>"
                  );
                }).join("")
              : '<p style="color:var(--muted);">Milestones will appear here once the plan is agreed.</p>';

            show("main");
          })
          .catch(function () { show("invalid"); });
      })();
    </script>
  </body>
</html>
