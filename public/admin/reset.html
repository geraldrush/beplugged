<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Set a New Password | Beplugged Tech</title>
  <link rel="icon" href="/img/favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink-900: #0d1826; --ink-700: #1f3049; --ink-500: #4a5568; --ink-400: #6b7688;
      --line: #e3e8ef; --surface: #fff; --surface-alt: #f7f9fc;
      --brand: #f05023; --brand-dark: #d23f14; --radius: 6px; --radius-lg: 10px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px; background: var(--ink-900); color: var(--ink-500);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      width: 100%; max-width: 420px; background: var(--surface);
      border-radius: var(--radius-lg); box-shadow: 0 18px 44px rgba(0,0,0,.35);
      padding: 38px 34px 32px;
    }
    .brand { text-align: center; margin-bottom: 26px; }
    .brand img { height: 54px; width: auto; }
    h1 { margin: 0 0 6px; font-size: 22px; font-weight: 700; letter-spacing: -.02em; color: var(--ink-900); text-align: center; }
    .sub { margin: 0 0 26px; font-size: 14.5px; color: var(--ink-400); text-align: center; }
    label { display: block; margin-bottom: 7px; font-size: 13.5px; font-weight: 600; color: var(--ink-700); }
    .field { margin-bottom: 18px; }
    input[type="password"], input[type="text"] {
      width: 100%; height: 46px; padding: 0 76px 0 14px; border: 1px solid var(--line);
      border-radius: var(--radius); background: var(--surface-alt);
      font-family: inherit; font-size: 15px; color: var(--ink-900);
      transition: border-color .18s, box-shadow .18s, background-color .18s;
    }
    input:focus { outline: none; background: var(--surface); border-color: var(--brand); box-shadow: 0 0 0 3px rgba(240,80,35,.14); }
    .password-wrap { position: relative; }
    .toggle {
      position: absolute; top: 50%; right: 8px; transform: translateY(-50%);
      height: 32px; padding: 0 10px; border: none; border-radius: 4px; background: transparent;
      color: var(--ink-400); font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .toggle:hover { color: var(--brand); background: rgba(240,80,35,.07); }
    .hint { margin: -8px 0 18px; font-size: 13px; color: var(--ink-400); }
    button.submit {
      width: 100%; height: 48px; border: none; border-radius: var(--radius);
      background: var(--brand); color: #fff; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
      transition: background-color .18s;
    }
    button.submit:hover:not(:disabled) { background: var(--brand-dark); }
    button.submit:disabled { opacity: .65; cursor: default; }
    .alert { display: none; margin-bottom: 18px; padding: 11px 14px; border-radius: var(--radius); font-size: 14px; line-height: 1.5; }
    .alert.show { display: block; }
    .alert.error { background: #fdecea; border: 1px solid #f5c3bc; color: #8c2114; }
    .alert.ok { background: #eaf6ef; border: 1px solid #bfe3cd; color: #1f6b41; }
    .links { margin-top: 18px; text-align: center; }
    .links a { font-size: 14px; color: var(--ink-400); text-decoration: none; }
    .links a:hover { color: var(--brand); }
    @media (max-width: 480px) { .card { padding: 30px 22px 26px; } }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand"><img src="/img/logo.png" alt="Beplugged Tech"></div>
    <h1>Set a new password</h1>
    <p class="sub">Choose something you have not used elsewhere.</p>

    <div id="alert" class="alert"></div>

    <form id="resetForm">
      <div class="field">
        <label for="password">New password</label>
        <div class="password-wrap">
          <input type="password" id="password" autocomplete="new-password" required minlength="12">
          <button type="button" class="toggle" id="togglePassword" aria-label="Show password">Show</button>
        </div>
      </div>
      <p class="hint">At least 12 characters.</p>
      <div class="field">
        <label for="confirm">Confirm new password</label>
        <div class="password-wrap">
          <input type="password" id="confirm" autocomplete="new-password" required minlength="12">
        </div>
      </div>
      <button type="submit" class="submit" id="resetBtn">Save new password</button>
    </form>

    <div class="links"><a href="/admin/login.html">Back to sign in</a></div>
  </div>

  <script>
    var params = new URLSearchParams(window.location.search);
    var token = params.get('token');
    var alertBox = document.getElementById('alert');
    var form = document.getElementById('resetForm');
    var pw = document.getElementById('password');

    function notify(message, kind) {
      alertBox.textContent = message;
      alertBox.className = 'alert show ' + (kind || 'error');
    }

    if (!token) {
      notify('This reset link is missing its token. Request a new one from the sign in page.');
      form.style.display = 'none';
    } else {
      // Drop the token from the address bar so it does not linger in history.
      history.replaceState(null, '', window.location.pathname);
    }

    var toggle = document.getElementById('togglePassword');
    toggle.addEventListener('click', function () {
      var showing = pw.type === 'text';
      pw.type = showing ? 'password' : 'text';
      toggle.textContent = showing ? 'Show' : 'Hide';
      toggle.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
      pw.focus();
    });

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      alertBox.className = 'alert';

      if (pw.value !== document.getElementById('confirm').value) {
        notify('Those two passwords do not match.');
        return;
      }

      var btn = document.getElementById('resetBtn');
      btn.disabled = true;
      btn.textContent = 'Saving...';

      try {
        var res = await fetch('/api/auth/reset', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: token, password: pw.value })
        });
        var data = await res.json();

        if (res.ok && data.success) {
          form.style.display = 'none';
          notify('Password updated. You can sign in with it now.', 'ok');
          setTimeout(function () { window.location.href = '/admin/login.html'; }, 2200);
          return;
        }
        notify(data.error || 'Could not reset the password.');
      } catch (err) {
        notify('Could not reset the password: ' + err.message);
      }

      btn.disabled = false;
      btn.textContent = 'Save new password';
    });
  </script>
</body>
</html>
