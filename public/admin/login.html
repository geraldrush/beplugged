<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin Sign In | Beplugged Tech</title>
  <link rel="icon" href="/img/favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink-900: #0d1826;
      --ink-700: #1f3049;
      --ink-500: #4a5568;
      --ink-400: #6b7688;
      --line: #e3e8ef;
      --surface: #ffffff;
      --surface-alt: #f7f9fc;
      --brand: #f05023;
      --brand-dark: #d23f14;
      --radius: 6px;
      --radius-lg: 10px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--ink-900);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      color: var(--ink-500);
      -webkit-font-smoothing: antialiased;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: var(--surface);
      border-radius: var(--radius-lg);
      box-shadow: 0 18px 44px rgba(0, 0, 0, .35);
      padding: 38px 34px 32px;
    }

    .brand { text-align: center; margin-bottom: 26px; }
    .brand img { height: 54px; width: auto; }

    h1 {
      margin: 0 0 6px;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -.02em;
      color: var(--ink-900);
      text-align: center;
    }

    .sub {
      margin: 0 0 26px;
      font-size: 14.5px;
      color: var(--ink-400);
      text-align: center;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--ink-700);
    }

    .field { margin-bottom: 18px; }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      height: 46px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface-alt);
      font-family: inherit;
      font-size: 15px;
      color: var(--ink-900);
      transition: border-color .18s, box-shadow .18s, background-color .18s;
    }

    input:focus {
      outline: none;
      background: var(--surface);
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(240, 80, 35, .14);
    }

    .password-wrap { position: relative; }
    .password-wrap input { padding-right: 76px; }

    .toggle {
      position: absolute;
      top: 50%;
      right: 8px;
      transform: translateY(-50%);
      height: 32px;
      padding: 0 10px;
      border: none;
      border-radius: 4px;
      background: transparent;
      color: var(--ink-400);
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .toggle:hover { color: var(--brand); background: rgba(240, 80, 35, .07); }
    .toggle:focus-visible { outline: 2px solid var(--brand); outline-offset: 1px; }

    button.submit {
      width: 100%;
      height: 48px;
      margin-top: 4px;
      border: none;
      border-radius: var(--radius);
      background: var(--brand);
      color: #fff;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color .18s;
    }

    button.submit:hover:not(:disabled) { background: var(--brand-dark); }
    button.submit:disabled { opacity: .65; cursor: default; }

    .links { margin-top: 18px; text-align: center; }

    .links a,
    .links button.link {
      border: none;
      background: none;
      padding: 0;
      font-family: inherit;
      font-size: 14px;
      color: var(--ink-400);
      text-decoration: none;
      cursor: pointer;
    }

    .links a:hover, .links button.link:hover { color: var(--brand); }

    .alert {
      display: none;
      margin-bottom: 18px;
      padding: 11px 14px;
      border-radius: var(--radius);
      font-size: 14px;
      line-height: 1.5;
    }

    .alert.show { display: block; }
    .alert.error { background: #fdecea; border: 1px solid #f5c3bc; color: #8c2114; }
    .alert.ok { background: #eaf6ef; border: 1px solid #bfe3cd; color: #1f6b41; }

    .back {
      margin-top: 24px;
      text-align: center;
      font-size: 13.5px;
    }

    .back a { color: rgba(255, 255, 255, .5); text-decoration: none; }
    .back a:hover { color: rgba(255, 255, 255, .85); }

    @media (max-width: 480px) {
      .card { padding: 30px 22px 26px; }
    }
  </style>
</head>
<body>
  <div>
    <div class="card">
      <div class="brand"><img src="/img/logo.png" alt="Beplugged Tech"></div>

      <h1 id="heading">Sign in</h1>
      <p class="sub" id="subheading">Admin access for Beplugged Tech.</p>

      <div id="alert" class="alert"></div>

      <!-- Sign in -->
      <form id="loginForm">
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" autocomplete="username" required autofocus>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="password-wrap">
            <input type="password" id="password" name="password" autocomplete="current-password" required>
            <button type="button" class="toggle" id="togglePassword" aria-label="Show password">Show</button>
          </div>
        </div>
        <button type="submit" class="submit" id="loginBtn">Sign in</button>
        <div class="links">
          <button type="button" class="link" id="showForgot">Forgot password?</button>
        </div>
        <div class="links" style="margin-top:14px;padding-top:14px;border-top:1px solid var(--line);">
          <button type="button" class="link" id="guestBtn" style="color:var(--brand);font-weight:600;">
            Look around a demo instead &rarr;
          </button>
          <div style="margin-top:5px;font-size:12.5px;color:var(--ink-400);">
            Read-only, with sample data. No account needed.
          </div>
        </div>
      </form>

      <!-- Forgot password -->
      <form id="forgotForm" style="display:none;">
        <div class="field">
          <label for="forgotUsername">Username</label>
          <input type="text" id="forgotUsername" name="username" autocomplete="username" required>
        </div>
        <button type="submit" class="submit" id="forgotBtn">Email a reset link</button>
        <div class="links">
          <button type="button" class="link" id="backToLogin">Back to sign in</button>
        </div>
      </form>
    </div>

    <p class="back"><a href="/">Back to the website</a></p>
  </div>

  <script>
    var alertBox = document.getElementById('alert');

    function notify(message, kind) {
      alertBox.textContent = message;
      alertBox.className = 'alert show ' + (kind || 'error');
    }

    function clearNotice() {
      alertBox.className = 'alert';
    }

    // Show/hide password.
    var pw = document.getElementById('password');
    var toggle = document.getElementById('togglePassword');
    toggle.addEventListener('click', function () {
      var showing = pw.type === 'text';
      pw.type = showing ? 'password' : 'text';
      toggle.textContent = showing ? 'Show' : 'Hide';
      toggle.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
      pw.focus();
    });

    var loginForm = document.getElementById('loginForm');
    var forgotForm = document.getElementById('forgotForm');
    var heading = document.getElementById('heading');
    var subheading = document.getElementById('subheading');

    document.getElementById('showForgot').addEventListener('click', function () {
      clearNotice();
      loginForm.style.display = 'none';
      forgotForm.style.display = '';
      heading.textContent = 'Reset password';
      subheading.textContent = 'We will email a reset link to the registered address.';
      document.getElementById('forgotUsername').focus();
    });

    document.getElementById('backToLogin').addEventListener('click', function () {
      clearNotice();
      forgotForm.style.display = 'none';
      loginForm.style.display = '';
      heading.textContent = 'Sign in';
      subheading.textContent = 'Admin access for Beplugged Tech.';
      document.getElementById('username').focus();
    });

    loginForm.addEventListener('submit', async function (e) {
      e.preventDefault();
      clearNotice();
      var btn = document.getElementById('loginBtn');
      btn.disabled = true;
      btn.textContent = 'Signing in...';

      try {
        var res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: pw.value
          })
        });
        var data = await res.json();

        if (res.ok && data.token) {
          localStorage.removeItem('authToken');
          sessionStorage.setItem('authToken', data.token);
          if (data.expires_at) sessionStorage.setItem('authTokenExpiresAt', data.expires_at);
          window.location.href = '/admin/';
          return;
        }
        notify(data.error || 'Invalid username or password');
      } catch (err) {
        notify('Could not sign in: ' + err.message);
      }

      btn.disabled = false;
      btn.textContent = 'Sign in';
    });

    document.getElementById('guestBtn').addEventListener('click', async function () {
      clearNotice();
      var btn = this;
      btn.disabled = true;
      btn.textContent = 'Opening demo...';
      try {
        var res = await fetch('/api/auth/guest', { method: 'POST' });
        var data = await res.json();
        if (res.ok && data.token) {
          localStorage.removeItem('authToken');
          sessionStorage.setItem('authToken', data.token);
          sessionStorage.setItem('authRole', 'guest');
          if (data.expires_at) sessionStorage.setItem('authTokenExpiresAt', data.expires_at);
          window.location.href = '/admin/';
          return;
        }
        notify(data.error || 'Could not open the demo.');
      } catch (err) {
        notify('Could not open the demo: ' + err.message);
      }
      btn.disabled = false;
      btn.innerHTML = 'Look around a demo instead &rarr;';
    });

    forgotForm.addEventListener('submit', async function (e) {
      e.preventDefault();
      clearNotice();
      var btn = document.getElementById('forgotBtn');
      btn.disabled = true;
      btn.textContent = 'Sending...';

      try {
        var res = await fetch('/api/auth/forgot', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: document.getElementById('forgotUsername').value })
        });
        var data = await res.json();
        notify(data.message || data.error || 'Request received.', res.ok ? 'ok' : 'error');
      } catch (err) {
        notify('Could not send the reset link: ' + err.message);
      }

      btn.disabled = false;
      btn.textContent = 'Email a reset link';
    });
  </script>
</body>
</html>
