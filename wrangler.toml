name = "beplugged-invoicing"
workers_dev = true
preview_urls = true
main = "src/index.js"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]
routes = [
  { pattern = "beplugged.co.za/*", zone_name = "beplugged.co.za" }
]

[assets]
directory = "public"
binding = "ASSETS"
# Static assets are normally served at the edge without running the Worker.
# These two pages have their card grids filled in from the catalogue, so the
# Worker has to see the request before the asset is returned.
run_worker_first = ["/service", "/training"]

[vars]
ENVIRONMENT = "production"
BREVO_REPLY_TO = "info@beplugged.co.za"
BREVO_SENDER_EMAIL = "info@beplugged.co.za"
BREVO_SENDER_NAME = "BepluggedTech"

[[d1_databases]]
binding = "DB"
database_name = "invoicing"
database_id = "8863ff6e-e263-41e1-a3af-a229e776f81d"

# Throttles the public /api/contact endpoint. period must be 10 or 60.
[[ratelimits]]
name = "CONTACT_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 5
  period = 60

# Separate namespace for admin login, so contact-form traffic can never
# exhaust the budget that protects the password check, or vice versa.
[[ratelimits]]
name = "LOGIN_LIMITER"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 5
  period = 60
