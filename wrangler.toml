name = "beplugged-invoicing"
workers_dev = true
preview_urls = true
main = "src/index.js"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]
# www is routed too, not because anything is served there, but because nothing
# was: the hostname resolved and then 404ed. The Worker redirects it to the
# apex, which it can only do if the request reaches the Worker at all.
routes = [
  { pattern = "beplugged.co.za/*", zone_name = "beplugged.co.za" },
  { pattern = "www.beplugged.co.za/*", zone_name = "beplugged.co.za" }
]

[assets]
directory = "public"
binding = "ASSETS"
# Static assets are normally served at the edge without running the Worker.
# The catalogue listings have their card grids filled in from the database, so
# the Worker has to see the request before the asset is returned.
#
# The remaining HTML pages are listed for a different reason: a request served
# straight from assets never reaches the Worker, so the www redirect could not
# fire and www/about answered 200 instead of redirecting. Only the indexable
# pages are listed. Stylesheets and images stay on the edge path, since nobody
# navigates to a stylesheet and no search engine indexes one as a page.
run_worker_first = ["/", "/about", "/contact", "/portfolio-details", "/service", "/training", "/training/courses", "/training/categories", "/training/unisa_modules", "/training/unisa_module", "/training/cos1511", "/training/cos11", "/academy"]

[vars]
ENVIRONMENT = "production"
# Only used until a password is set through the reset flow, after which the
# username and password hash both live in D1. Not a secret on its own.
ADMIN_USERNAME = "admin"
BREVO_REPLY_TO = "info@beplugged.co.za"
BREVO_SENDER_EMAIL = "info@beplugged.co.za"
BREVO_SENDER_NAME = "BepluggedTech"

# The academy compiler. The key itself is a secret:
#   wrangler secret put JUDGE0_KEY
# Language 54 is C++ (GCC 9.2.0), which every Judge0 CE deployment carries.
# Raise it only after checking the instance actually offers the newer one,
# because an unknown id fails every run.
JUDGE0_HOST = "judge0-ce.p.rapidapi.com"
JUDGE0_LANGUAGE_ID = "54"

[[d1_databases]]
binding = "DB"
database_name = "invoicing"
database_id = "8863ff6e-e263-41e1-a3af-a229e776f81d"

# Throttles the public /api/contact endpoint. period must be 10 or 60.
[[ratelimits]]
name = "CONTACT_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 5
  period = 60

# The academy Run button. Its own namespace because a student debugging a loop
# presses Run far more often than anyone submits the contact form, and because
# a lab or household behind one address would otherwise lock its own students
# out. Compiling costs real compute, so this is still a ceiling, just one set
# for someone practising rather than someone filling in a form.
[[ratelimits]]
name = "ACADEMY_LIMITER"
namespace_id = "1003"

  [ratelimits.simple]
  limit = 30
  period = 60

# Separate namespace for admin login, so contact-form traffic can never
# exhaust the budget that protects the password check, or vice versa.
[[ratelimits]]
name = "LOGIN_LIMITER"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 5
  period = 60
